# Charter — a fictional public body's charter, to show the page layout keys (#73): white, black words, everything on the left,
# a footer band, the institutional block large on the cover, a light table head. No real institution's logo or name.
name: ""
logo: logo.svg
primary: "#1F3A68"
accent: "#1F3A68"
highlight: "#E8EEF7"
ink: "#161616"
secondary: "#5A6B85"
font-display: Arial
font-body: Arial
font-fallback: "Helvetica Neue", Helvetica, sans-serif
type-scale: 0.86
watermark: none
card-marker: none
card-fill: plain
card-shadow: none
footer: Office national de l'exemple · Direction des usages numériques
motion: none
align: left
footer-band: line
cover-logo: large
table-head: light
chrome-label: body
# what a charter decides of its colours and its cover (2026-11-12): black titles beside the navy, six accents for the charts,
# three status colours, the cover's title in capitals
title-color: "#000000"
chart-colors: ["#1F3A68", "#2E7D9A", "#6A9F3B", "#C9A227", "#B5543C", "#7A5C99"]
status-ok: "#2E8540"
status-warn: "#F59C00"
status-error: "#D52B1E"
cover-case: upper
