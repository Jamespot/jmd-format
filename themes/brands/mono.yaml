# Mono — neutral, black and white with one yellow: the minimal keynote look
name: ""   # neutral: the lockup shows the mark alone
logo: tri
primary: "#0F0F0F"
accent: "#3A3A3A"
highlight: "#FFE14D"
ink: "#111111"
secondary: "#7A7A7A"
font-display: Futura
font-body: Helvetica Neue
font-fallback: "Century Gothic", "Segoe UI", system-ui, sans-serif
type-scale: 0.9          # Futura runs wide
fonts: fonts/system.css   # system fonts only — nothing embedded
glyphs: 4
watermark: mark
card-marker: glyphs
card-fill: plain
card-shadow: offset
motion: soft
