# Slate — neutral, graphite and teal: the sober corporate deck (think the default Office theme, without the blue)
name: ""   # neutral: the lockup shows the mark alone
logo: square
primary: "#1F2933"
accent: "#0E9F8E"
highlight: "#F5B841"
ink: "#1F2933"
secondary: "#52606D"
font-display: Helvetica Neue
font-body: Helvetica Neue
font-fallback: "Segoe UI", system-ui, sans-serif
type-scale: 0.94         # system faces run wider than the embedded ones
fonts: fonts/system.css   # system fonts only — nothing embedded
glyphs: 4
decor: mark               # none | ready elements (mark circles quarter glow waves band dots) | a map of named elements (spec/jmd.md, Brand decor) — `watermark:` is its old name
card-marker: letter
card-fill: plain
card-shadow: none
motion: soft
